<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPOSE AI</title>
    <!-- 样式库：换回最稳定的官方 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 交互库 -->
    <script defer src="https://cdn.staticfile.net/alpinejs/3.13.3/cdn.min.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('website', () => ({
                lang: 'cn',
                isMenuOpen: false,
                content: {
                    cn: {
                        navTitle: "KPOSE AI",
                        navLinks: ["工作流", "服务模式", "核心优势", "联系我们"],
                        heroTitle1: "具身智能时代的",
                        heroTitleHighlight: "高质量",
                        heroTitle2: "物理动作数据供应商",
                        heroSub: "完美解决 Sim-to-Real 痛点，为人形机器人提供 RL-ready 的标准动作资产库与专家级精修服务。",
                        cta: "获取免费测试数据",
                        videoPlaceholder: "16:9 宣传视频占位符",
                        imgPlaceholder: "图片占位符",
                        workflowTitle: "核心技术工作流 (SOP)",
                        steps: [
                            { img: "./workflow-1.jpg", icon: "activity", title: "1. 自主动捕 (Mocap)", desc: "穿戴专业动捕设备，录制真实人类动作，拥有100%底层数据完整知识产权，从源头把控质量。" },
                            { img: "./workflow-2.jpg", icon: "wrench", title: "2. 专家级精修", desc: "资深动画师操刀，彻底消除脚部滑步 (Foot Sliding)、肢体穿模、重心偏移等动捕通病。" },
                            { img: "./workflow-3.jpg", icon: "cpu", title: "3. 算法重定向 (GMR)", desc: "通过 GMR 系统将精修动作完美映射到宇树、智元等机器人模型，生成强化学习 (RL) 友好数据矩阵。" },
                            { img: "./workflow-4.jpg", icon: "shield-check", title: "4. 物理验证 (Sim Validation)", desc: "导入 MuJoCo / Isaac Sim 进行重力、摩擦力测试，确保机器人动作平滑，不摔倒、不抽搐。" }
                        ],
                        servicesTitle: "商业变现与服务模式",
                        services: [
                            { 
                                img: "./service-1.jpg",
                                icon: "wrench", 
                                title: "高端定制服务", 
                                desc: "客户提供粗糙数据与机器人模型 (URDF/XML)，我们提供从清洗、重定向到物理验证的全链路精修服务。交付包含关节角度/速度的 .npy 矩阵及仿真预览。",
                                btnText: "获取定制报价"
                            },
                            { 
                                img: "./service-2.jpg",
                                icon: "database", 
                                title: "标准化动作资产包", 
                                desc: "自研并出售“工业装配”、“家政服务”、“物流搬运”等标准动作库。即买即用，一次构建，无限授权，大幅加速机器人研发周期。",
                                btnText: "索取动作库目录"
                            }
                        ],
                        whyUsTitle: "为什么选择我们？",
                        whyUs: [
                            "降维打击：拥有超越传统外包的算法与物理引擎理解，同时具备 AI 工程师极度缺乏的动画精修手感。",
                            "绝对定价权：打通“数据源头 -> 艺术精修 -> 算法重定向 -> 物理验证”的完美闭环，不依赖第三方劣质开源数据。",
                            "极高性价比：立足郑州的人力与运营成本优势，为您提供媲美硅谷顶尖实验室的数据质量与交付速度。"
                        ],
                        contactTitle: "联系我们 / 申请测试数据",
                        contactSub: "请填写下方表单，或直接发送邮件至 ani@kposeai.com，我们会在 12 小时内回复您，并可签署 NDA 保密协议。",
                        formName: "姓名 / 称呼",
                        formEmail: "工作邮箱",
                        formRobot: "机器人型号 (选填)",
                        formMessage: "您的需求 (例如：需要测试数据、有动捕文件需要精修评估...)",
                        formSubmit: "发送请求",
                        footer: "© 2026 KPOSE AI. All rights reserved. | 郑州 · 面向全球",
                        attachmentNote: "提交后，我们将通过邮件与您互传文件"
                    },
                    en: {
                        navTitle: "KPOSE AI",
                        navLinks: ["Workflow", "Services", "Advantages", "Contact"],
                        heroTitle1: "",
                        heroTitleHighlight: "High-Quality",
                        heroTitle2: " Physical Motion Data for Embodied AI",
                        heroSub: "Solving Sim-to-Real pain points. Providing RL-ready standard motion assets and expert-level polishing for humanoid robots.",
                        cta: "Request Free Sample Data",
                        videoPlaceholder: "16:9 Promo Video",
                        imgPlaceholder: "Image Placeholder",
                        workflowTitle: "Core Technical Workflow (SOP)",
                        steps: [
                            { img: "./workflow-1.jpg", icon: "activity", title: "1. In-house Mocap", desc: "Recording real human motions with professional mocap suits, owning 100% IP of the base data to ensure quality from the source." },
                            { img: "./workflow-2.jpg", icon: "wrench", title: "2. Expert Polish", desc: "Veteran animators eliminate foot sliding, self-penetration, and Center of Mass (COM) issues." },
                            { img: "./workflow-3.jpg", icon: "cpu", title: "3. GMR Retargeting", desc: "Mapping polished motions to robot models (Unitree, Agility, etc.) via GMR, generating Reinforcement Learning (RL) friendly matrices." },
                            { img: "./workflow-4.jpg", icon: "shield-check", title: "4. Sim Validation", desc: "Testing in MuJoCo / Isaac Sim for gravity and friction to ensure stable, jitter-free robot control without falling." }
                        ],
                        servicesTitle: "Business Models & Services",
                        services: [
                            { 
                                img: "./service-1.jpg",
                                icon: "wrench", 
                                title: "Premium Custom Services", 
                                desc: "You provide raw data and robot models (URDF/XML), we handle the end-to-end pipeline from cleaning to physics validation. Delivering .npy matrices and sim previews.",
                                btnText: "Get a Custom Quote"
                            },
                            { 
                                img: "./service-2.jpg",
                                icon: "database", 
                                title: "Standard Motion Packs", 
                                desc: "Proprietary motion libraries for industrial assembly, domestic service, and logistics. Ready-to-use, build once, license infinitely.",
                                btnText: "Request Asset Catalog"
                            }
                        ],
                        whyUsTitle: "Why Choose Us?",
                        whyUs: [
                            "Unfair Advantage: Better algorithm and physics engine understanding than traditional agencies, with the animation feel and polish that AI engineers lack.",
                            "Closed Loop: Raw Data -> Art Polish -> Algorithmic Retargeting -> Physics Validation. No reliance on poor open-source data.",
                            "Cost-Effective: Top-tier Silicon Valley quality backed by optimized operational costs, delivering unmatched ROI."
                        ],
                        contactTitle: "Contact Us / Request Sample Data",
                        contactSub: "Fill out the form below or email us directly at ani@kposeai.com. We reply within 12 hours. NDA signing is available upon request.",
                        formName: "Name",
                        formEmail: "Work Email",
                        formRobot: "Robot Model (Optional)",
                        formMessage: "How can we help? (e.g., Requesting sample data, need evaluation for raw mocap files...)",
                        formSubmit: "Send Message",
                        footer: "© 2026 KPOSE AI. All rights reserved. | Zhengzhou · Global Reach",
                        attachmentNote: "File attachments will be handled via email"
                    }
                },
                get t() { return this.content[this.lang]; },
                toggleLang() {
                    this.lang = this.lang === 'cn' ? 'en' : 'cn';
                },
                init() {
                    const browserLang = navigator.language || navigator.userLanguage || '';
                    if (browserLang.toLowerCase().includes('zh')) { this.lang = 'cn'; } 
                    else { this.lang = 'en'; }
                    
                    // 初始化 Lucide 图标
                    setTimeout(() => {
                        if (window.lucide) {
                            window.lucide.createIcons();
                        }
                    }, 100);
                },
                scrollToContact() {
                    const contactSection = document.getElementById('section-3');
                    if (contactSection) { contactSection.scrollIntoView({ behavior: 'smooth' }); }
                }
            }));
        });
    </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50 font-sans selection:bg-blue-500 selection:text-white relative" x-data="website">
    
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Logo 区域 -->
                <div class="flex items-center gap-2">
                    <img src="./logo.png" alt="Logo" class="h-8 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('default-logo').style.display='block';">
                    <i id="default-logo" data-lucide="box" class="h-8 w-8 text-blue-500" style="display: none;"></i>
                    <span class="font-bold text-xl tracking-tight" x-text="t.navTitle">KPOSE AI</span>
                </div>
                
                <!-- 桌面端导航链接 -->
                <div class="hidden md:flex items-center space-x-8">
                    <template x-for="(link, idx) in t.navLinks" :key="idx">
                        <a :href="'#section-' + idx" class="text-sm font-medium text-slate-300 hover:text-white transition-colors" x-text="link"></a>
                    </template>
                </div>

                <!-- 语言切换按钮 -->
                <button @click="toggleLang" class="flex items-center gap-1 text-sm font-medium bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full transition-colors">
                    <i data-lucide="globe" class="w-4 h-4"></i>
                    <span x-text="lang === 'cn' ? 'EN' : '中'"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section (首屏) -->
    <section id="section-0" class="relative pt-20 pb-20 overflow-hidden">
        <!-- 背景视频 -->
        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-20">
            <source src="./bg-video.mp4" type="video/mp4">
        </video>
        <div class="relative max-w-5xl mx-auto px-4 text-center z-10">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6">
                <span x-text="t.heroTitle1"></span>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300" x-text="t.heroTitleHighlight"></span>
                <br/>
                <span x-text="t.heroTitle2"></span>
            </h1>
            <p class="text-lg md:text-xl text-slate-400 mb-10 max-w-2xl mx-auto" x-text="t.heroSub"></p>
            
            <button @click="scrollToContact" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-8 rounded-full transition-all flex items-center gap-2 mx-auto mb-16">
                <span x-text="t.cta"></span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>

            <!-- 宣传视频窗口 (Promo Video) -->
            <div class="relative w-full max-w-4xl mx-auto aspect-video bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
                <!-- 视频播放器 -->
                <video controls class="w-full h-full object-cover">
                    <source src="./promo-video.mp4" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
        </div>
    </section>

    <!-- 工作流 Section -->
    <section id="section-1" class="py-20 bg-slate-900/50">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-16" x-text="t.workflowTitle"></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <template x-for="(step, index) in t.steps" :key="index">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-blue-500/50 transition-colors flex flex-col">
                        <!-- 工作流图片 -->
                        <div class="w-full aspect-video bg-slate-800 relative">
                            <img :src="step.img" alt="Workflow" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="absolute inset-0 flex items-center justify-center text-slate-600" style="display: none;">
                                <span x-text="t.imgPlaceholder"></span>
                            </div>
                        </div>
                        <!-- 工作流文字内容 -->
                        <div class="p-6 flex-1">
                            <div class="w-10 h-10 bg-blue-900/30 rounded-lg flex items-center justify-center mb-4 text-blue-400">
                                <i :data-lucide="step.icon" class="w-5 h-5"></i>
                            </div>
                            <h3 class="text-xl font-semibold mb-3" x-text="step.title"></h3>
                            <p class="text-slate-400 text-sm leading-relaxed" x-text="step.desc"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- 服务模式 Section -->
    <section id="section-2" class="py-20">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-16" x-text="t.servicesTitle"></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <template x-for="(service, index) in t.services" :key="index">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/50 transition-colors flex flex-col md:flex-row">
                        <!-- 服务模式图片 -->
                        <div class="md:w-2/5 aspect-square md:aspect-auto bg-slate-800 relative">
                            <img :src="service.img" alt="Service" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="absolute inset-0 flex items-center justify-center text-slate-600" style="display: none;">
                                <span x-text="t.imgPlaceholder"></span>
                            </div>
                        </div>
                        <!-- 服务模式文字内容 -->
                        <div class="p-8 md:w-3/5 flex flex-col justify-center">
                            <div class="w-12 h-12 bg-cyan-900/30 rounded-xl flex items-center justify-center mb-4 text-cyan-400">
                                <i :data-lucide="service.icon" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-2xl font-bold mb-4" x-text="service.title"></h3>
                            <p class="text-slate-400 mb-6 leading-relaxed text-sm" x-text="service.desc"></p>
                            <a href="#section-3" class="text-cyan-400 hover:text-cyan-300 font-medium flex items-center gap-1 mt-auto">
                                <span x-text="service.btnText"></span>
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </a>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- 核心优势 Section -->
    <section id="section-3" class="py-20 bg-slate-900/50">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row gap-12 items-center">
            <div class="md:w-1/3">
                <h2 class="text-3xl font-bold mb-4" x-text="t.whyUsTitle"></h2>
                <p class="text-slate-400">KPOSE AI 致力于打破高质量具身数据的成本壁垒。</p>
            </div>
            <div class="md:w-2/3 space-y-6">
                <template x-for="(item, index) in t.whyUs" :key="index">
                    <div class="flex gap-4">
                        <div class="flex-shrink-0 mt-1 text-blue-500">
                            <i data-lucide="check-circle" class="w-6 h-6"></i>
                        </div>
                        <p class="text-slate-300 leading-relaxed" x-text="item"></p>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- 联系我们 Section -->
    <section id="section-4" class="py-20">
        <div class="max-w-2xl mx-auto px-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 md:p-12">
                <div class="text-center mb-10">
                    <h2 class="text-2xl font-bold mb-3" x-text="t.contactTitle"></h2>
                    <p class="text-slate-400 text-sm" x-text="t.contactSub"></p>
                </div>
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2" x-text="t.formName"></label>
                            <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-400 mb-2" x-text="t.formEmail"></label>
                            <input type="email" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2" x-text="t.formRobot"></label>
                        <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2" x-text="t.formMessage"></label>
                        <textarea rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"></textarea>
                    </div>
                    <p class="text-xs text-slate-500 flex items-center gap-2">
                        <i data-lucide="paperclip" class="w-4 h-4"></i>
                        <span x-text="t.attachmentNote"></span>
                    </p>
                    <button type="button" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-4 rounded-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]" x-text="t.formSubmit"></button>
                </form>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="border-t border-slate-800 py-8 text-center text-slate-500 text-sm">
        <p x-text="t.footer"></p>
    </footer>

    <!-- 重新渲染 Lucide 图标的 Alpine 监听器 -->
    <script>
        document.addEventListener('alpine:initialized', () => {
            Alpine.effect(() => {
                // 当语言切换导致 DOM 更新时，重新渲染图标
                const lang = Alpine.store('website')?.lang;
                setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }, 50);
            });
        });
    </script>
</body>
</html>
