<body class="bg-slate-950 text-slate-200 font-sans antialiased selection:bg-blue-500 selection:text-white" x-data="website">

    <!-- 导航栏 -->

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-lg flex items-center justify-center font-bold text-white">K</div>
                    <span class="font-bold text-xl tracking-wider text-white" x-text="content[lang].navTitle"></span>
                </div>
                
                <!-- 桌面端菜单 -->
                <div class="hidden md:flex items-center space-x-8">
                    <template x-for="link in content[lang].navLinks">
                        <a href="#" class="text-sm font-medium text-slate-300 hover:text-white transition-colors" x-text="link"></a>
                    </template>
                    
                    <!-- 语言切换 -->
                    <button @click="lang = lang === 'cn' ? 'en' : 'cn'" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-xs font-medium transition-colors border border-slate-700">

                        <span x-text="lang === 'cn' ? 'EN' : '中文'"></span>
                    </button>
                </div>

                <!-- 移动端菜单按钮 -->
                <div class="md:hidden flex items-center gap-4">
                    <button @click="lang = lang === 'cn' ? 'en' : 'cn'" class="text-xs font-medium px-2 py-1 bg-slate-800 rounded border border-slate-700" x-text="lang === 'cn' ? 'EN' : '中文'"></button>
                    <button @click="isMenuOpen = !isMenuOpen" class="text-slate-300 hover:text-white">

                    <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-slate-300 hover:text-white hover:bg-slate-800" x-text="link"></a>

            </div>
        </div>

    <!-- Hero Section (首屏) -->

            <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-cyan-500/10 rounded-full blur-3xl"></div>

                            <p class="text-slate-400 text-sm leading-relaxed" x-text="step.desc"></p>

                    </div>

    </div>

    <!-- 服务模式 Section -->

                            <span x-text="service.btnText"></span>

                        </a>
                    </div>
                </template>
            </div>

    </div>

    <!-- 为什么选择我们 Section -->

                            <p class="ml-4 text-slate-300 leading-relaxed" x-text="reason"></p>

                    </template>

            </div>
        </div>
